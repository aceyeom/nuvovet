<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#05070D" />
    <script>
      // Paint the right canvas before the app loads: dark behind the landing
      // page and the demo, white behind the clinic workspace.
      (function () {
        var p = location.pathname;
        var c = p === '/' || p.indexOf('/demo') === 0 ? '#05070D' : '#ffffff';
        document.documentElement.style.setProperty('--page-canvas', c);
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute('content', c);
      })();
    </script>
    <meta name="description" content="nuvoDUR — a drug utilization review layer that sits on top of your clinic's EMR and expands the moment a prescription needs a second look. Interaction, species/breed, dosing and organ-load checks for dogs and cats." />
    <meta property="og:title" content="nuvoDUR — Every prescription reviewed. Every interaction caught." />
    <meta property="og:description" content="Veterinary drug utilization review that lives on top of the EMR you already use." />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>nuvovet — Veterinary DUR on top of your EMR</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
